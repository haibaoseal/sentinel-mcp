# Policy ruleset for the governed MCP runtime.
#
# Design posture: every rule fails closed. A tool that is absent from `tools`
# is NOT allowed -- it falls through to `defaults.unknown_tool` and requires
# human approval. That is deliberate: adding a new tool (including one that
# appears at runtime from a remote MCP server) must never silently widen what
# the agent can do.
#
# `side_effect: real` marks a tool that touches the outside world. Those are
# refused unless the matching runtime flag is switched on, so the default
# posture of a fresh checkout is that nothing real is ever mutated.
#
# Two blocks per rule describe constraints, and they differ in who reads them:
#
#   constraints:            the engine *enforces* these (currently `read_only`).
#   documented_guarantees:  a note for a human reader. The enforcement lives in
#                           the tool implementation and nothing in the engine
#                           reads these keys. An earlier version put them under
#                           `constraints`, where deleting one looked like it
#                           would widen access and changed nothing at all.
version: "1.0"

defaults:
  unknown_tool: require_approval
  unknown_action: require_approval

known_action_types:
  - read
  - write
  - external_send
  - destructive
  - financial
  - unknown

connectors:
  defaults:
    real_connectors_enabled: false
    real_write_actions_enabled: false
    real_destructive_actions_enabled: false
    real_external_actions_enabled: false

# ---------------------------------------------------------------------------
# MCP namespace
# ---------------------------------------------------------------------------
# Tools discovered from MCP servers are registered under `mcp.<server>.<tool>`.
# Because they are not listed below individually, they inherit
# `defaults.unknown_tool` = require_approval. An operator who wants a specific
# remote tool to run unattended must name it explicitly; there is no wildcard
# that grants a whole server.
tools:
  mcp_list_servers:
    action_type: read
    risk: low
    approval_required: false
  mcp_list_tools:
    action_type: read
    risk: low
    approval_required: false

  # --- Example: individually reviewed MCP tools -----------------------------
  # A server's tools are NOT granted by naming the server. Each remote tool that
  # an operator wants to run unattended is declared here by its qualified name,
  # so the approval decision is visible in review. Everything else a server
  # advertises falls through to `defaults.unknown_tool` (require_approval).
  #
  # The mapping declared on the server spec (`tool_actions`) controls the risk
  # *label* placed on the discovered descriptor; this file controls whether the
  # call is allowed. Both are required, deliberately: relabelling a remote tool
  # must not be sufficient to authorise it.
  mcp.demo.repo_stats:
    action_type: read
    risk: low
    approval_required: false
  mcp.demo.count_pattern:
    action_type: read
    risk: low
    approval_required: false
  mcp.demo.echo:
    action_type: read
    risk: low
    approval_required: false
  # scratch_write has real side effects, so it is held for approval even though
  # the demo maps it explicitly. This is the line a reviewer should check.
  mcp.demo.scratch_write:
    action_type: write
    risk: high
    approval_required: true
    side_effect: real

  # -------------------------------------------------------------------------
  # Local read-only tools
  # -------------------------------------------------------------------------
  fs_list:
    action_type: read
    risk: low
    approval_required: false

  # Read-only tools run unattended: that is what makes the runtime usable. The
  # real control on them is not approval but confinement -- see
  # `constraints.sandboxed`, the path check in FilesystemSandbox.resolve, and
  # the read_only SQL allow-list. A policy that demanded approval for every file
  # read would simply train reviewers to click through, which is worse than not
  # asking.
  fs_read:
    action_type: read
    risk: medium
    approval_required: false
    documented_guarantees:
      sandboxed: true
      max_bytes: 262144

  fs_search:
    action_type: read
    risk: low
    approval_required: false
    documented_guarantees:
      sandboxed: true

  search_knowledge_base:
    action_type: read
    risk: low
    approval_required: false

  sql_query:
    action_type: read
    risk: medium
    approval_required: false
    constraints:
      read_only: true

  sql_schema:
    action_type: read
    risk: low
    approval_required: false
    # Deliberately NOT `constraints.read_only`. That constraint means "the supplied
    # query string must be a read-only statement", which requires a `query` argument
    # -- and this tool takes none, so the constraint blocked it with "read-only but no
    # query was supplied". Its read-only property is structural instead: it uses the
    # same connection opened with mode=ro as sql_query, and it only reads PRAGMA
    # metadata.

  http_get:
    action_type: read
    risk: medium
    approval_required: false
    documented_guarantees:
      allowlist_required: true

  github_list_issues:
    action_type: read
    risk: low
    approval_required: false

  github_read_issue:
    action_type: read
    risk: low
    approval_required: false

  github_list_pull_requests:
    action_type: read
    risk: low
    approval_required: false

  github_read_pull_request:
    action_type: read
    risk: low
    approval_required: false

  # -------------------------------------------------------------------------
  # Local write / destructive / external tools. All require approval, and the
  # ones marked `side_effect: real` stay behind a runtime flag as well.
  # -------------------------------------------------------------------------
  write_file_draft:
    action_type: write
    risk: medium
    approval_required: true
    documented_guarantees:
      sandboxed: true

  sql_execute_write:
    action_type: destructive
    risk: critical
    approval_required: true
    default_block: true
    side_effect: real

  http_post:
    action_type: external_send
    risk: high
    approval_required: true
    side_effect: real
    documented_guarantees:
      allowlist_required: true

  github_post_issue_comment:
    action_type: external_send
    risk: high
    approval_required: true
    enabled: false
    side_effect: real

  github_close_issue:
    action_type: destructive
    risk: critical
    approval_required: true
    default_block: true
    enabled: false
    side_effect: real

  send_email:
    action_type: external_send
    risk: high
    approval_required: true
    side_effect: real

  delete_file:
    action_type: destructive
    risk: critical
    approval_required: true
    default_block: true
    side_effect: real

  draft_refund:
    action_type: financial
    risk: high
    approval_required: true

# ---------------------------------------------------------------------------
# Sensitive-data detection in arguments. Scanned as substrings against the
# lowercased JSON of the arguments, so a hit escalates to critical risk and
# forces approval for an otherwise-allowed tool.
# ---------------------------------------------------------------------------
sensitive_patterns:
  - name: credentials
    patterns:
      - "password"
      - "passwd"
      - "api_key"
      - "apikey"
      - "secret"
      - "token"
      - "private_key"
      - "bearer "
  - name: personal_identifier
    patterns:
      - "ssn"
      - "passport"
      - "身份证"
      - "银行卡"
      - "社保"
  - name: payment
    patterns:
      - "credit_card"
      - "card_number"
      - "cvv"
      - "iban"

# ---------------------------------------------------------------------------
# Risk escalation. Read by the engine as a *floor*: a ruleset may raise one of
# these levels and never lower it, so `destructive_action: low` cannot switch a
# critical escalation off. These three keys are the ones with an implementation;
# `external_recipient`, `contains_secret` and `modifies_database` used to sit here
# reading like controls while nothing read them.
# ---------------------------------------------------------------------------
risk_escalation:
  destructive_action: critical
  financial_action: critical
  sends_message: high
