name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, hermetic checks. No network, no API keys, no model calls: the whole
  # point of the provider abstraction is that a contributor without a key can
  # still verify every governance guarantee.
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,api]" -c constraints.txt

      - name: Lint
        run: python -m ruff check apps/api/app mcp_servers scripts migrations

      - name: Format check
        run: python -m ruff format --check apps/api/app mcp_servers scripts migrations

      - name: Tests
        run: python -m pytest apps/api/app/tests -q

      # End-to-end HTTP lifecycle against a temporary database: auth, tenancy,
      # approval round trip, audit verification/export and metrics.
      - name: HTTP service smoke test
        run: python scripts/api_smoke.py

      - name: Migration and model drift
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite:///./ci-migration.db"
          python -m alembic upgrade head
          python -m alembic check

      # The regression gate. Fails the build if a gated metric drops below the
      # recorded baseline, or if the number of checks behind a metric shrinks while
      # its rate stays at 1.0 -- the latter is how a suite is quietly hollowed out
      # while still reporting a perfect score.
      - name: Evaluation suite and regression gate
        run: python -m app.evals.cli

      # Exercises the *live* code path -- HTTP client, request encoding, response
      # decoding, runtime assembly, live trace marking, governance under a real
      # provider -- against a local OpenAI-compatible stub. No network and no key,
      # but it is the path a real model takes, and it is where the nested tool_calls
      # encoding bug was found.
      - name: Live path against a local stub
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mock_llm_stub.py 8799 &
          STUB=$!
          trap 'kill $STUB 2>/dev/null || true' EXIT
          # Wait for the port rather than sleeping a fixed amount.
          for _ in $(seq 1 40); do
            if python -c "import socket,sys; socket.create_connection(('127.0.0.1',8799),1).close()" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          LLM_API_KEY=ci-not-a-secret \
          LLM_MODEL=ci-stub-model \
          LLM_BASE_URL=http://127.0.0.1:8799/v1 \
            python scripts/live_smoke.py

      # Reported as SKIPPED (exit 77), never as a pass: a real vendor cannot be
      # reached from CI without a secret, and "we did not run this" is not "this
      # works". Configure the LLM_API_KEY secret to enable it.
      - name: Live smoke against a real model (optional)
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python scripts/live_smoke.py || code=$?
          code=${code:-0}
          if [ "$code" = "77" ]; then
            echo "::notice::live smoke skipped: no LLM_API_KEY secret configured"
          elif [ "$code" != "0" ]; then
            echo "::error::live smoke failed against a real model"
            exit "$code"
          fi

      # Governance claims are executable, so CI runs the demonstrations too. If a
      # redaction shape regresses or the chain stops self-verifying, this fails
      # even if a unit test was quietly weakened.
      - name: Verify governance guarantees
        run: python scripts/verify_p0_fixes.py

      # Reads code and data and asserts each README claim directly, so a claim that
      # stops holding fails the build rather than quietly becoming false.
      - name: Verify the project's claims
        run: python scripts/verify_objective.py

      # Spawns a real MCP server over stdio and drives it through the firewall.
      # `mcp` is a core dependency, so this step only re-asserts the floor; it is kept
      # so the outbound half still works if the dependency is ever made optional.
      - name: Install MCP extra
        run: python -m pip install "mcp>=1.9,<3.0"

      - name: MCP gateway demo
        run: python scripts/demo_mcp_gateway.py

      - name: Governed agent demo
        run: python scripts/demo_agent.py

      # Reproduces the bypasses the guardrails exist to stop. If a pattern is
      # weakened, this fails even when the unit tests were adjusted to match.
      - name: Guardrail demo
        run: python scripts/demo_guardrails.py

      # Exercises the real tools through the governed path: read-only SQL (which runs
      # on a mode=ro connection), a blocked SQL write, the labelled GitHub fixture,
      # a disabled GitHub write tool, and an HTTP allow-list refusal.
      - name: Real tools demo
        run: python scripts/demo_tools.py

  # Guards the property that makes this project worth reading: tool execution has
  # exactly one authorised path. Adding a transport (MCP over stdio or HTTP) must
  # not create a second, ungoverned route to a tool.
  boundary:
    name: execution boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry is reached only from the firewall
        shell: bash
        run: |
          set -euo pipefail
          # Only governance/firewall.py may call ToolRegistry.execute. Anything
          # else reaching the registry directly would skip policy and audit.
          #
          # Tests are excluded for the same reason as the check below: a test that
          # asserts the registry's own resolution has to call it. This exclusion was
          # missing, and test_mcp_gateway.py's shadowing test made the job fail --
          # a red boundary job is worse than no boundary job, because it trains
          # everyone to ignore it.
          violations=$(grep -rn --include='*.py' -E 'registry\.execute\(' apps/api/app \
            | grep -v '^apps/api/app/governance/firewall.py:' \
            | grep -v '/tests/' \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::A module reached the tool registry outside the firewall:"
            echo "$violations"
            exit 1
          fi
          echo "Registry access is confined to the firewall."

      - name: Tool sources are reached only from the registry
        shell: bash
        run: |
          set -euo pipefail
          # source.execute(...) belongs to the registry. A caller executing a
          # source directly bypasses the registry's collision and provenance
          # checks as well as the firewall.
          violations=$(grep -rn --include='*.py' -E '\bsource\.execute\(' apps/api/app \
            | grep -v '^apps/api/app/tools/registry.py:' \
            | grep -v '/tests/' \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::A module executed a tool source directly:"
            echo "$violations"
            exit 1
          fi
          echo "Tool sources are reached only through the registry."

      - name: The firewall does not accept an optional session
        shell: bash
        run: |
          set -euo pipefail
          # An optional session parameter is how the archived implementation
          # ended up with a path that executed tools while skipping every audit
          # write. Keep it mandatory.
          if grep -n -E 'session\s*:\s*Session\s*\|\s*None' apps/api/app/governance/firewall.py; then
            echo "::error::Firewall accepts an optional session; execution must always be recorded."
            exit 1
          fi
          echo "Firewall requires a session."

      - name: MCP tools are governed, not granted
        shell: bash
        run: |
          set -euo pipefail
          # A discovered MCP tool must not default to a permissive action type.
          # If this default ever became something other than "unknown", every new
          # MCP server would silently gain authority.
          if ! grep -q 'tool_actions.get(remote_name, "unknown")' apps/api/app/mcp/client.py; then
            echo "::error::Unmapped MCP tools no longer default to the 'unknown' action type."
            exit 1
          fi
          # Child processes must not inherit the operator's whole environment.
          if ! grep -q 'ENV_ALLOWLIST' apps/api/app/mcp/client.py; then
            echo "::error::MCP stdio children no longer use an environment allow-list."
            exit 1
          fi
          echo "MCP discovery remains fail-closed."

  # The service is documented as Postgres-first. This job runs the real migration
  # chain and the HTTP lifecycle against Postgres, so "it works on SQLite" cannot
  # stand in for "the production database path works".
  postgres:
    name: postgres + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel-ci@127.0.0.1:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install service + Postgres driver
        run: python -m pip install -e ".[api,postgres]" -c constraints.txt
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: HTTP lifecycle against Postgres
        run: python scripts/postgres_smoke.py
