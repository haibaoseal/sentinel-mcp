[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mcp"
version = "0.2.0"
description = "A governed Model Context Protocol gateway: policy, human approval, hash-chained audit and evaluation for tool-calling agents."
readme = "README.md"
requires-python = ">=3.11"

# Upper bounds are deliberate. An unpinned lower-bound-only dependency set means
# the eval report cannot be reproduced by a reviewer, which is the single claim
# this project most needs to be able to defend.
#
# The core dependency set stays a library + CLIs. The HTTP service, metrics and
# migrations are an optional `api` extra so a reviewer can still install and test
# the governance core with no web stack; Postgres is a separate `postgres` extra.
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "mcp>=1.9,<3.0",
]

[project.optional-dependencies]
# The service layer is optional so that the governance library still installs
# without a web stack. `pip install -e ".[api]"` is the supported service install.
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "prometheus-client>=0.20,<1.0",
  "alembic>=1.13,<2.0",
]
postgres = [
  "psycopg[binary]>=3.1,<4.0",
]
dev = [
  "pytest>=8.2,<10.0",
  "ruff>=0.5,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
sentinel-api = "app.api.main:run"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/tests/*" = ["E501"]
